name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build APK
        run: ./gradlew :doom:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doom-debug-apk
          path: doom/build/outputs/apk/debug/*.apk
